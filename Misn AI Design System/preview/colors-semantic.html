<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <div class="mono-sm" style="margin-bottom:8px">Daily · Body / Life · Action</div>
      <span class="chip chip--pink">BODY · 30 min</span>
    </div>
    <div>
      <div class="mono-sm" style="margin-bottom:8px">Strategy · Build</div>
      <span class="chip chip--gold">BUILD · PHASE 02</span>
    </div>
    <div>
      <div class="mono-sm" style="margin-bottom:8px">Growth · Milestone</div>
      <span class="chip chip--emerald">GROW · COMPLETE</span>
    </div>
    <div>
      <div class="mono-sm" style="margin-bottom:8px">Rest · Balance</div>
      <span class="chip chip--sage">REST · 15 min</span>
    </div>
    <div>
      <div class="mono-sm" style="margin-bottom:8px">Muted · Locked</div>
      <span class="chip">LOCKED</span>
    </div>
    <div>
      <div class="mono-sm" style="margin-bottom:8px">Danger · Destructive</div>
      <span class="chip" style="color:#FF3AAE;border-color:#FF3AAE;background:rgba(255,58,174,0.1)">DELETE MATRIX</span>
    </div>
  </div>
</div></body></html>
