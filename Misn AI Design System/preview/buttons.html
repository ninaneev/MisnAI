<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;flex-direction:column;gap:18px">
    <div>
      <div class="mono-sm" style="color:#D4B878;margin-bottom:10px">PRIMARY · PINK</div>
      <div style="display:flex;gap:10px">
        <button style="padding:10px 20px;background:#FF3AAE;color:#FDF4E3;font-family:'IBM Plex Mono',monospace;font-size:13px;border:none;border-radius:16px;box-shadow:0 10px 30px rgba(255,58,174,0.24);cursor:pointer">Save</button>
        <button style="padding:6px 12px;background:#FF3AAE;color:#FDF4E3;font-family:'IBM Plex Mono',monospace;font-size:11px;border:none;border-radius:12px;cursor:pointer">Mark complete</button>
      </div>
    </div>
    <div>
      <div class="mono-sm" style="color:#D4B878;margin-bottom:10px">GHOST · FOREST BORDER</div>
      <div style="display:flex;gap:10px">
        <button style="padding:10px 20px;background:rgba(13,43,30,0.45);color:#9BA8A2;font-family:'IBM Plex Mono',monospace;font-size:13px;border:1px solid #1E4A2E;border-radius:16px;cursor:pointer">Edit</button>
        <button style="padding:6px 12px;background:transparent;color:#9BA8A2;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;border:1px solid #1E4A2E;border-radius:12px;cursor:pointer">Cancel</button>
      </div>
    </div>
    <div>
      <div class="mono-sm" style="color:#D4B878;margin-bottom:10px">DANGER · OUTLINE PINK</div>
      <button style="padding:10px 20px;background:rgba(255,58,174,0.08);color:#FF3AAE;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;border:1px solid #FF3AAE;border-radius:16px;cursor:pointer">Delete matrix</button>
    </div>
  </div>
</div></body></html>
