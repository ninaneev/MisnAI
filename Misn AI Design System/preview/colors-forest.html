<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div class="row">
      <div class="swatch" style="background:#090909"><span class="name">Base</span><span class="hex">#090909</span></div>
      <div class="swatch" style="background:#111111"><span class="name">Surface</span><span class="hex">#111111</span></div>
      <div class="swatch" style="background:#1A1A1A"><span class="name">Surface 2</span><span class="hex">#1A1A1A</span></div>
      <div class="swatch" style="background:#050505"><span class="name">Ink</span><span class="hex">#050505</span></div>
    </div>
    <div class="row">
      <div class="swatch" style="background:#E5484D"><span class="name">Signal Red</span><span class="hex">#E5484D</span></div>
      <div class="swatch on-light" style="background:#F6F3EC"><span class="name">Paper</span><span class="hex">#F6F3EC</span></div>
      <div class="swatch on-light" style="background:#DDD8CF"><span class="name">Mist</span><span class="hex">#DDD8CF</span></div>
      <div class="swatch" style="background:#2A2A2A"><span class="name">Border</span><span class="hex">#2A2A2A</span></div>
    </div>
  </div>
</div></body></html>
