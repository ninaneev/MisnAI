<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="chip chip--pink">DAILY</span>
      <span class="chip chip--gold">BUILD</span>
      <span class="chip chip--emerald">GROW</span>
      <span class="chip chip--sage">REST</span>
      <span class="chip">LOCKED</span>
      <span class="chip" style="color:#E8D5A3;border-color:rgba(212,184,120,0.30);background:rgba(212,184,120,0.08);">STRATEGY</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid #1E4A2E;background:rgba(13,43,30,0.55);border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9BA8A2;letter-spacing:0.18em;text-transform:uppercase">
        <span style="width:6px;height:6px;border-radius:999px;background:#FF3AAE;box-shadow:0 0 10px rgba(255,58,174,0.7)"></span>LIVE
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid rgba(22,163,122,0.3);background:rgba(22,163,122,0.08);border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#16A37A;letter-spacing:0.18em;text-transform:uppercase">
        ✓ COMPLETE
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid rgba(212,184,120,0.3);background:rgba(212,184,120,0.06);border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#D4B878;letter-spacing:0.18em;text-transform:uppercase">
        PHASE 02
      </div>
    </div>
    <div>
      <div class="mono-sm" style="color:#D4B878;margin-bottom:8px">NUMERIC COUNTER</div>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:24px;color:#D4B878">03</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:18px;color:#9BA8A2"> / 08</span>
    </div>
  </div>
</div></body></html>
