<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .task-row {
    position: relative;
    display: grid;
    grid-template-columns: 26px 1fr auto;
    gap: 16px;
    align-items: flex-start;
    border-radius: 12px;
    padding: 16px 20px;
    isolation: isolate;
  }
  .task-row::before {
    content: '';
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 0 2px 2px 0;
  }

  /* ACTIVE — pink, deep plum surface, subtle gradient wash, pink glow */
  .task-row--active {
    background:
      linear-gradient(100deg, rgba(255,58,174,0.10) 0%, rgba(255,58,174,0.02) 35%, rgba(10,14,12,0.94) 75%),
      rgba(20,16,26,0.94);
    border: 1px solid rgba(255,58,174,0.22);
    box-shadow:
      0 10px 30px rgba(255,58,174,0.12),
      0 6px 20px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .task-row--active::before {
    background: linear-gradient(180deg, #FF3AAE, #CC2E8A);
    box-shadow: 0 0 12px rgba(255,58,174,0.55);
  }

  /* DONE — emerald, deep forest, soft gold hairline on top edge, still dignified */
  .task-row--done {
    background:
      linear-gradient(100deg, rgba(22,163,122,0.08) 0%, rgba(8,20,14,0.94) 55%),
      rgba(8,20,14,0.94);
    border: 1px solid rgba(22,163,122,0.18);
    box-shadow: 0 6px 20px rgba(0,0,0,0.32);
  }
  .task-row--done::before {
    background: linear-gradient(180deg, #16A37A 0%, #A7F06D 100%);
  }

  /* Checkbox */
  .check {
    width: 20px; height: 20px;
    border-radius: 5px;
    margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .check--empty {
    border: 1.5px solid rgba(255,58,174,0.55);
    background: rgba(255,58,174,0.05);
    box-shadow: inset 0 0 0 1px rgba(10,14,12,0.6);
  }
  .check--done {
    background: linear-gradient(135deg, #16A37A, #0F6D59);
    border: 1px solid rgba(22,163,122,0.6);
    color: #E8F5E5;
    font-size: 11px;
    font-weight: 600;
  }

  /* Meta column */
  .meta {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .meta .num {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 22px;
    line-height: 1;
    font-weight: 500;
  }
  .meta .num--pink { color: #FF3AAE; }
  .meta .num--emerald { color: #A7F06D; }
  .meta .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #8B9E97;
  }

  /* Chip overrides for richer gold */
  .chip-rich {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px; border: 1px solid;
  }
  .chip-pink  { color: #FF3AAE; border-color: rgba(255,58,174,0.3);  background: rgba(255,58,174,0.08); }
  .chip-gold  { color: #E0B84A; border-color: rgba(224,184,74,0.38); background: rgba(224,184,74,0.10); }

  .title {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: -0.01em;
    color: #FDF4E3;
    margin: 6px 0 0;
    line-height: 1.3;
  }
  .title em {
    font-style: italic;
    color: #E0B84A;
  }
  .title--done {
    color: #9BA8A2;
    text-decoration: line-through;
    text-decoration-color: rgba(167,240,109,0.45);
    text-decoration-thickness: 1px;
  }
  .sub {
    font-family: Inter, sans-serif;
    font-size: 12.5px;
    line-height: 1.55;
    color: #9BA8A2;
    margin-top: 6px;
  }
  .sub .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #E0B84A;
    margin-right: 6px;
  }

  .ornament {
    position: absolute;
    right: 20px; top: 20px;
    height: 1px; width: 40px;
    background: linear-gradient(90deg, transparent 0%, rgba(224,184,74,0.55) 50%, transparent 100%);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex;flex-direction:column;gap:12px">

    <!-- ACTIVE row -->
    <div class="task-row task-row--active">
      <div class="check check--empty"></div>
      <div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="chip-rich chip-pink">Deliver · 45 min</span>
          <span class="chip-rich chip-gold">Phase 02</span>
        </div>
        <h3 class="title">Validate hero copy with <em>three founders</em> in your cohort</h3>
        <p class="sub"><span class="label">Output</span>One refinement per voice, logged by end of block</p>
      </div>
      <div class="meta">
        <span class="num num--pink">03</span>
        <span class="stamp">Active · now</span>
      </div>
    </div>

    <!-- DONE row -->
    <div class="task-row task-row--done">
      <div class="check check--done">✓</div>
      <div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="chip-rich chip-gold">Decide · 25 min</span>
        </div>
        <h3 class="title title--done">Pick the pricing tier to show above the fold</h3>
        <p class="sub"><span class="label" style="color:#A7F06D">Logged</span>Pro tier · 4-criterion matrix · 7.0 winning score</p>
      </div>
      <div class="meta">
        <span class="num num--emerald">02</span>
        <span class="stamp">Closed 11:08</span>
      </div>
    </div>

  </div>
</div>
</body></html>
