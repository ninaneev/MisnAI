<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
    <div>
      <div class="mono-sm" style="color:#D4B878;margin-bottom:8px">CARD · DEFAULT</div>
      <div style="width:280px;height:72px;background:rgba(10,14,12,0.92);border:1px solid rgba(255,255,255,0.06);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.28)"></div>
    </div>
    <div>
      <div class="mono-sm" style="color:#D4B878;margin-bottom:8px">HERO PANEL · GOLD BORDER</div>
      <div style="width:360px;height:80px;background:linear-gradient(135deg,#0A2418 0%,#0D2B1E 65%,#071812 100%);border:1px solid rgba(212,184,120,0.22);border-radius:16px;box-shadow:0 18px 52px rgba(0,0,0,0.40)"></div>
    </div>
    <div>
      <div class="mono-sm" style="color:#D4B878;margin-bottom:8px">ACTION · PINK GLOW</div>
      <div style="display:inline-block;padding:10px 24px;background:#FF3AAE;color:#FDF4E3;font-family:'IBM Plex Mono',monospace;font-size:13px;border-radius:16px;box-shadow:0 10px 30px rgba(255,58,174,0.28)">MARK COMPLETE</div>
    </div>
  </div>
</div></body></html>
