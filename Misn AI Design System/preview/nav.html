<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .nav-surface {
    background:
      radial-gradient(ellipse 70% 60% at 0% 0%, rgba(229,72,77,0.08) 0%, transparent 60%),
      linear-gradient(180deg, #121212 0%, #090909 100%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 22px 18px;
    box-shadow: 0 20px 48px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px 16px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .nav-brand svg { flex-shrink: 0; }
  .nav-brand__name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #E5484D;
  }
  .nav-brand__sub {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #A8A29A;
  }
  .nav-list { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 40px;
    padding: 0 14px;
    border-radius: 8px;
    color: #A8A29A;
    font-family: Inter, sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .nav-item__icon {
    width: 18px; height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #A8A29A;
    transition: color 150ms ease;
  }
  .nav-item:hover {
    background: rgba(255,255,255,0.025);
    color: #F6F3EC;
  }
  .nav-item:hover .nav-item__icon { color: #F6F3EC; }
  .nav-item--active {
    background: linear-gradient(90deg, rgba(229,72,77,0.10) 0%, rgba(229,72,77,0.02) 100%);
    color: #F6F3EC;
  }
  .nav-item--active::before {
    content: '';
    position: absolute;
    left: -18px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: linear-gradient(180deg, #E5484D, #B53138);
    border-radius: 0 2px 2px 0;
    box-shadow: 0 0 10px rgba(229,72,77,0.45);
  }
  .nav-item--active .nav-item__icon { color: #E5484D; }
  .nav-item__hint {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #6F6860;
  }
  .nav-item--active .nav-item__hint { color: #E5484D; }
</style>
</head>
<body>
<div class="card">
  <div class="nav-surface">
    <div class="nav-brand">
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="8" stroke="#F6F3EC" stroke-width="1.4"/>
        <path d="M7 14 L11 7 L15 14" stroke="#F6F3EC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 7 L14 10" stroke="#E5484D" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="nav-brand__name">Misn AI</span>
      <span class="nav-brand__sub">P. 02</span>
    </div>
    <div class="nav-list">
      <div class="nav-item nav-item--active">
        <span class="nav-item__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="16" rx="2"/>
            <line x1="4" y1="10" x2="20" y2="10"/>
            <line x1="8" y1="3" x2="8" y2="7"/>
            <line x1="16" y1="3" x2="16" y2="7"/>
          </svg>
        </span>
        <span>Today</span>
        <span class="nav-item__hint">3/8</span>
      </div>
      <div class="nav-item">
        <span class="nav-item__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="5"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
          </svg>
        </span>
        <span>Strategy</span>
      </div>
      <div class="nav-item">
        <span class="nav-item__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3h8v5a4 4 0 0 1-8 0V3z"/>
            <path d="M5 5H3a2 2 0 0 0 0 4h2"/>
            <path d="M19 5h2a2 2 0 0 1 0 4h-2"/>
            <path d="M10 14l-1 4h6l-1-4"/>
            <line x1="7" y1="20" x2="17" y2="20"/>
          </svg>
        </span>
        <span>Milestones</span>
        <span class="nav-item__hint">3/5</span>
      </div>
      <div class="nav-item">
        <span class="nav-item__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v18"/>
            <path d="M5 7l7-2 7 2"/>
            <path d="M3 13l2-6 2 6a3 3 0 0 1-4 0z"/>
            <path d="M17 13l2-6 2 6a3 3 0 0 1-4 0z"/>
            <path d="M7 21h10"/>
          </svg>
        </span>
        <span>Decide</span>
      </div>
    </div>
  </div>
</div>
</body></html>
