<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .bg-wrap {
    position: relative;
    width: 700px;
    height: 340px;
    overflow: hidden;
    border-radius: 8px;
  }
  .bg-wrap svg.layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .caption {
    position: absolute;
    bottom: 18px;
    left: 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(246,243,236,0.92);
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    z-index: 3;
  }
  .caption__title {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-style: italic;
    font-weight: 500;
    letter-spacing: -0.005em;
    background: linear-gradient(135deg, #F6F3EC 0%, #DDD8CF 45%, #E5484D 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  .corner-stamp {
    position: absolute;
    top: 18px;
    right: 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(229,72,77,0.78);
    z-index: 3;
  }
</style>
</head>
<body>
<div class="card" style="padding:0">
  <div class="bg-wrap">
    <svg class="layer" viewBox="0 0 1400 680" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="mission-glow" cx="30%" cy="18%" r="86%">
          <stop offset="0%"  stop-color="#1A1011"/>
          <stop offset="45%" stop-color="#0F0F10"/>
          <stop offset="100%" stop-color="#060606"/>
        </radialGradient>
        <filter id="field-noise" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
          <feColorMatrix in="noise" type="matrix"
            values="0 0 0 0 0.06
                    0 0 0 0 0.06
                    0 0 0 0 0.06
                    0 0 0 0.15 0"/>
        </filter>
        <linearGradient id="red-vein" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#2A0E10" stop-opacity="0"/>
          <stop offset="20%"  stop-color="#681F24" stop-opacity="0.55"/>
          <stop offset="45%"  stop-color="#B53138" stop-opacity="0.95"/>
          <stop offset="60%"  stop-color="#E5484D" stop-opacity="1"/>
          <stop offset="80%"  stop-color="#B53138" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#2A0E10" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="mist-line" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#1A1A1A" stop-opacity="0"/>
          <stop offset="35%"  stop-color="#A8A29A" stop-opacity="0.28"/>
          <stop offset="55%"  stop-color="#F6F3EC" stop-opacity="0.55"/>
          <stop offset="80%"  stop-color="#A8A29A" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
        </linearGradient>
        <filter id="red-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <rect width="1400" height="680" fill="url(#mission-glow)"/>
      <rect width="1400" height="680" filter="url(#field-noise)" opacity="0.6"/>

      <path d="M -50 120 Q 180 200, 340 180 T 640 220 Q 820 240, 940 200 T 1260 280 Q 1380 310, 1450 340"
            stroke="url(#red-vein)" stroke-width="2.5" fill="none" filter="url(#red-glow)" stroke-linecap="round"/>
      <path d="M -50 500 Q 200 440, 420 470 T 780 500 Q 960 520, 1120 490 T 1450 510"
            stroke="url(#mist-line)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M -50 60 Q 160 40, 340 90 Q 480 130, 620 70"
            stroke="url(#mist-line)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.45"/>
      <path d="M 420 200 Q 480 280, 540 360 Q 580 420, 620 510"
            stroke="url(#red-vein)" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.5"/>
      <path d="M 840 540 Q 940 600, 1080 580 Q 1220 560, 1380 620"
            stroke="url(#mist-line)" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.38"/>

      <g fill="#F6F3EC">
        <circle cx="260" cy="180" r="1" opacity="0.36"/>
        <circle cx="540" cy="260" r="0.8" opacity="0.30"/>
        <circle cx="780" cy="210" r="0.9" opacity="0.28"/>
        <circle cx="1040" cy="310" r="1.1" opacity="0.32"/>
      </g>

      <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
        <stop offset="50%"  stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
      </radialGradient>
      <rect width="1400" height="680" fill="url(#vignette)"/>
    </svg>

    <div style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(229,72,77,0.16) 0%, transparent 60%);pointer-events:none;z-index:2"></div>
    <span class="corner-stamp">Black - paper - red</span>
    <div class="caption">
      <span class="caption__title">Mission Field</span>
      SIGNATURE BACKGROUND
    </div>
  </div>
</div>
</body></html>
