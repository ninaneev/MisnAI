<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;flex-direction:column;gap:2px;background:rgba(10,14,12,0.85);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:6px 14px">
    <div class="token-row"><span class="k">--radius-xs</span><span class="v">4px</span></div>
    <div class="token-row"><span class="k">--radius-sm</span><span class="v">6px</span></div>
    <div class="token-row"><span class="k">--radius-md</span><span class="v">8px</span></div>
    <div class="token-row"><span class="k">--radius-lg</span><span class="v">12px · cards</span></div>
    <div class="token-row"><span class="k">--radius-xl</span><span class="v">16px · buttons, hero</span></div>
    <div class="token-row"><span class="k">--radius-2xl</span><span class="v">20px · phase cards</span></div>
    <div class="token-row"><span class="k">--radius-full</span><span class="v">999px · chips, avatars</span></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:16px;align-items:center;justify-content:flex-start">
    <div style="width:60px;height:60px;background:#0D2B1E;border:1px solid #1E4A2E;border-radius:4px"></div>
    <div style="width:60px;height:60px;background:#0D2B1E;border:1px solid #1E4A2E;border-radius:8px"></div>
    <div style="width:60px;height:60px;background:#0D2B1E;border:1px solid #1E4A2E;border-radius:12px"></div>
    <div style="width:60px;height:60px;background:#0D2B1E;border:1px solid #1E4A2E;border-radius:16px"></div>
    <div style="width:60px;height:60px;background:#0D2B1E;border:1px solid #1E4A2E;border-radius:20px"></div>
    <div style="width:60px;height:60px;background:#0D2B1E;border:1px solid rgba(212,184,120,0.22);border-radius:999px"></div>
  </div>
</div></body></html>
