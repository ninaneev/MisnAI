<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  html, body {
    background:
      radial-gradient(ellipse 80% 55% at 50% 0%, rgba(229,72,77,0.14) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 90% 100%, rgba(229,72,77,0.08) 0%, transparent 55%),
      linear-gradient(160deg, #090909 0%, #111111 55%, #090909 100%) !important;
  }
  .hero {
    position: relative;
    background:
      radial-gradient(ellipse 60% 80% at 100% 0%, rgba(229,72,77,0.10) 0%, transparent 60%),
      linear-gradient(135deg, #131313 0%, #0E0E0F 60%, #090909 100%);
    border: 1px solid rgba(246,243,236,0.14);
    border-radius: 18px;
    box-shadow:
      0 24px 60px rgba(0,0,0,0.55),
      0 2px 0 rgba(255,255,255,0.03) inset,
      0 -1px 0 rgba(0,0,0,0.4) inset;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(229,72,77,0.45) 50%, transparent 100%);
  }
  .hero__body { padding: 32px 36px 24px; }
  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #E5484D;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .kicker::before,
  .kicker::after {
    content: '';
    display: inline-block;
    width: 22px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(229,72,77,0.6));
  }
  .kicker::after { background: linear-gradient(90deg, rgba(229,72,77,0.6), transparent); }
  .title {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: 52px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #F6F3EC;
    margin: 18px 0 0;
  }
  .title em {
    font-style: italic;
    color: #E5484D;
  }
  .sub {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 16px;
  }
  .sub__date {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 14px;
    color: #DDD8CF;
    letter-spacing: 0.01em;
  }
  .sub__dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #E5484D;
    box-shadow: 0 0 8px rgba(229,72,77,0.5);
  }
  .sub__meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #A8A29A;
  }
  .rule {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 36px;
    margin: 20px 0 14px;
  }
  .rule__line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(229,72,77,0.35) 50%, transparent 100%);
  }
  .rule__diamond {
    width: 6px; height: 6px;
    background: linear-gradient(135deg, #F6F3EC, #E5484D);
    transform: rotate(45deg);
    box-shadow: 0 0 6px rgba(229,72,77,0.35);
  }
  .foot {
    padding: 0 36px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .foot__label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #A8A29A;
  }
  .foot__count {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 22px;
    font-weight: 500;
    color: #E5484D;
    letter-spacing: -0.01em;
  }
  .foot__count .of { color: #6F6860; font-size: 14px; margin: 0 2px; }
  .foot__count .total { color: #DDD8CF; font-size: 14px; }
  .progress {
    margin: 0 36px 26px;
    height: 2px;
    background: rgba(255,255,255,0.05);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress__fill {
    width: 37%;
    height: 100%;
    background: linear-gradient(90deg, #E5484D, #B53138);
    box-shadow: 0 0 8px rgba(229,72,77,0.4);
  }
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <div class="hero__body">
      <span class="kicker">Misn AI - Daily Blocks</span>
      <h1 class="title">Today, you <em>ship</em>.</h1>
      <div class="sub">
        <span class="sub__date">Monday, the twentieth of April</span>
        <span class="sub__dot"></span>
        <span class="sub__meta">Week 14 - Phase 02 Traction</span>
      </div>
    </div>
    <div class="rule">
      <span class="rule__line"></span>
      <span class="rule__diamond"></span>
      <span class="rule__line"></span>
    </div>
    <div class="foot">
      <span class="foot__label">Blocks closed</span>
      <span class="foot__count">03<span class="of">/</span><span class="total">08</span></span>
    </div>
    <div class="progress"><div class="progress__fill"></div></div>
  </div>
</div>
</body></html>
