<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  html, body {
    background:
      radial-gradient(ellipse 50% 50% at 50% 0%, rgba(224,184,74,0.05) 0%, transparent 60%),
      linear-gradient(160deg, #0A0D10 0%, #10131A 55%, #0A0D10 100%) !important;
  }

  /* Form panel — like a real settings surface */
  .form-panel {
    background: linear-gradient(180deg, #0C1015 0%, #0A0D10 100%);
    border: 1px solid rgba(224,184,74,0.16);
    border-radius: 14px;
    padding: 26px 28px;
    position: relative;
    box-shadow:
      0 20px 48px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .form-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,217,122,0.45) 50%, transparent);
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(224,184,74,0.12);
    margin-bottom: 18px;
  }
  .panel-head__title {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 500;
    color: #FDF4E3;
    letter-spacing: -0.01em;
  }
  .panel-head__title em {
    font-style: italic;
    background: linear-gradient(135deg, #FBE29A, #E0B84A, #8A6A22);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .panel-head__stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #8B9E97;
  }

  /* Field */
  .field {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field__label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #8B9E97;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .field__label .required {
    color: #E0B84A;
    font-size: 10px;
  }

  .input, .textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 16px;
    background: linear-gradient(180deg, #07090C 0%, #0A0D12 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    color: #FDF4E3;
    font-family: Inter, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    outline: none;
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,0.5),
      inset 0 -1px 0 rgba(255,255,255,0.02);
    transition: border-color 180ms ease, box-shadow 180ms ease;
  }
  .input--serif {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    padding: 14px 16px;
  }
  .input:hover { border-color: rgba(224,184,74,0.28); }

  .input--focused {
    border-color: rgba(255,58,174,0.65);
    box-shadow:
      0 0 0 3px rgba(255,58,174,0.08),
      0 0 32px rgba(255,58,174,0.12),
      inset 0 1px 2px rgba(0,0,0,0.5);
  }
  .input--saved {
    border-color: rgba(224,184,74,0.4);
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(224,184,74,0.04);
  }

  .field__affix {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
  }
  .field__affix--focused { color: #FF3AAE; }
  .field__affix--saved { color: #E0B84A; }
  .field__affix .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .field__affix--focused .dot {
    background: #FF3AAE;
    box-shadow: 0 0 8px rgba(255,58,174,0.7);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .field__affix--saved .dot {
    background: linear-gradient(135deg, #FBE29A, #8A6A22);
    box-shadow: 0 0 6px rgba(224,184,74,0.5);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Character counter */
  .field__counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: #5B6662;
    align-self: flex-end;
    margin-top: -2px;
  }
  .field__counter em {
    font-style: normal;
    color: #E0B84A;
  }

  /* Gold hairline divider */
  .hairline {
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(224,184,74,0.3) 50%, transparent 100%);
    margin: 18px 0 4px;
  }
  .hairline-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 10px;
  }
  .hairline-label::before, .hairline-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(224,184,74,0.3), transparent);
  }
  .hairline-label span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #8B9E97;
  }

  /* Checkboxes */
  .check-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 4px;
    border-radius: 8px;
    transition: background 150ms ease;
  }
  .check-row:hover { background: rgba(224,184,74,0.03); }

  .cb {
    width: 20px; height: 20px;
    border-radius: 5px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 140ms ease;
    position: relative;
  }
  .cb--off {
    border: 1.5px solid rgba(224,184,74,0.3);
    background: linear-gradient(180deg, #07090C, #0A0D12);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }
  .cb--pink {
    border: 1px solid rgba(255,58,174,0.6);
    background: linear-gradient(135deg, #FF3AAE 0%, #CC2E8A 100%);
    box-shadow:
      0 0 0 3px rgba(255,58,174,0.1),
      0 4px 14px rgba(255,58,174,0.24),
      inset 0 1px 0 rgba(255,255,255,0.25);
    color: #1A0710;
  }
  .cb--gold {
    border: 1px solid rgba(224,184,74,0.55);
    background: linear-gradient(135deg, #FBE29A 0%, #E0B84A 45%, #8A6A22 100%);
    box-shadow:
      0 0 0 3px rgba(224,184,74,0.1),
      0 4px 14px rgba(138,106,34,0.25),
      inset 0 1px 0 rgba(255,255,255,0.35);
    color: #1F1608;
  }
  .cb-label {
    font-family: Inter, sans-serif;
    font-size: 14px;
    color: #EEE8DC;
    flex: 1;
  }
  .cb-label--done {
    color: #8B9E97;
    text-decoration: line-through;
    text-decoration-color: rgba(224,184,74,0.4);
    text-decoration-thickness: 1px;
  }
  .cb-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #5B6662;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="card">
  <div class="form-panel">

    <div class="panel-head">
      <h2 class="panel-head__title">Define the <em>decision</em></h2>
      <span class="panel-head__stamp">Misn AI · form</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:18px">

      <div class="field">
        <label class="field__label">Decision title <span class="required">·</span></label>
        <input class="input input--serif" value="Raise or revenue — April decision"/>
      </div>

      <div class="field">
        <label class="field__label">Context <span class="required">·</span></label>
        <textarea class="textarea" rows="2">Commit to 90 days of distribution before opening a pre-seed round.</textarea>
        <span class="field__counter">84 / <em>280</em></span>
      </div>

      <div class="field">
        <label class="field__label">Strategic area</label>
        <input class="input input--focused" value="Strategic Context" readonly/>
        <span class="field__affix field__affix--focused"><span class="dot"></span>Focused</span>
      </div>

      <div class="field">
        <label class="field__label">Headline copy</label>
        <input class="input input--saved" value="Pricing page copy, v3" readonly/>
        <span class="field__affix field__affix--saved"><span class="dot"></span>Saved 11:08</span>
      </div>

    </div>

    <div class="hairline-label"><span>Criteria · pick what matters</span></div>

    <div style="display:flex;flex-direction:column;gap:2px">
      <div class="check-row">
        <span class="cb cb--off"></span>
        <span class="cb-label">Reach new founders</span>
        <span class="cb-meta">w 30</span>
      </div>
      <div class="check-row">
        <span class="cb cb--pink">
          <svg width="11" height="9" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="cb-label">Time to signal</span>
        <span class="cb-meta">w 25</span>
      </div>
      <div class="check-row">
        <span class="cb cb--gold">
          <svg width="11" height="9" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="cb-label cb-label--done">Compounds with content</span>
        <span class="cb-meta">w 25 · saved</span>
      </div>
    </div>

  </div>
</div>
</body></html>
