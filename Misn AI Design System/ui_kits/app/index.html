<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Misn AI - UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #090909; color: var(--text-body); font-family: var(--font-sans); }
  * { box-sizing: border-box; }
  em { font-family: var(--font-display); }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="TodayScreen.jsx"></script>
<script type="text/babel" src="StrategyScreen.jsx"></script>
<script type="text/babel" src="DetailScreens.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const [active, setActive] = useState(() => localStorage.getItem('misn:nav') || 'today');
    useEffect(() => { localStorage.setItem('misn:nav', active); }, [active]);

    let Screen;
    switch (active) {
      case 'today':      Screen = TodayScreen; break;
      case 'strategy':   Screen = StrategyScreen; break;
      case 'milestones': Screen = MilestonesScreen; break;
      case 'decisions':  Screen = DecisionsScreen; break;
      default:           Screen = PlaceholderScreen;
    }

    return (
      <AppShell active={active} onNavigate={setActive}>
        <Screen navLabel={active} />
      </AppShell>
    );
  }

  function PlaceholderScreen({ navLabel }) {
    const item = NAV_ITEMS.find(i => i.id === navLabel);
    return (
      <div>
        <MonoLabel color="pink" tracking={0.32}>Coming into focus</MonoLabel>
        <h1 style={{
          fontFamily: 'var(--font-display)', fontWeight: 500, fontSize: 40,
          color: 'var(--text)', margin: '14px 0 14px', letterSpacing: '-0.015em'
        }}>
          <em style={{ fontStyle: 'italic', color: 'var(--pink)' }}>{item?.label}</em>
        </h1>
        <p style={{ fontSize: 15, lineHeight: 1.6, color: 'var(--muted)', maxWidth: 560 }}>
          {item?.guide}
        </p>
        <div style={{ marginTop: 36, padding: '20px 22px',
          border: '1px dashed rgba(229,72,77,0.25)', borderRadius: 12,
          background: 'rgba(22,14,14,0.45)' }}>
          <MonoLabel color="pink" tracking={0.28}>Kit preview</MonoLabel>
          <p style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 17, color: 'var(--text)', margin: '8px 0 0' }}>
            Screen not yet built in this kit - Today, Strategy, Milestones, and Decide are the documented examples.
          </p>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
